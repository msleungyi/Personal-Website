bio: |
  I am a doctoral researcher in psycholinguistics at the Ludwig-Maximilians-University of Munich, formerly trained and served as a Chinese language teacher in Hong Kong primary and secondary schools. My research revolves around the cognitive mechanisms underlying reading development and the methodology used to identify subtypes of developmental dyslexia. I also build infrastructures based on metascientific principles to help synthesise research findings in psychological sciences. I am committed to bridging the gap between scientific research and the actual practice in the educational and clinical settings. My goal is to translate cross-disciplinary knowledge for researchers, educators, practitioners, and parents by connecting insights across fields. I am currently leading the [Re-SearchTerms](../projects/research-terms/) Project at [FORRT](https://forrt.org).

  🌐 This website is bilingual (English / [繁體中文](../zh-hant/)). Use the language switcher in the navigation bar to browse in your preferred language.

